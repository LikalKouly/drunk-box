<script type="module">

// ───────────────────────── Réglages ─────────────────────────

let S = loadSettings();

  ['slide', "Angle d'emportement", 8, 60, 1, '°'],

const VIEWS_LABEL = { face: 'De face', top: 'Plongée (depuis le plafond)', three: 'Trois-quarts', below: 'Contre-plongée (depuis le sol)' };

const panel = document.getElementById('panel');

// ───────────────────────── Rendu ─────────────────────────
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
function onResize() { renderer.setSize(innerWidth, innerHeight, false); }
addEventListener('resize', onResize); onResize();

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ───────────────────────── Salle (diorama carton) ─────────────────────────
const W = 10, H = 6, D = 6;
const LO = [-W / 2, 0, -D / 2], HI = [W / 2, H, D / 2];
const AX = ['x', 'y', 'z'];
const AXV = [new V3(1, 0, 0), new V3(0, 1, 0), new V3(0, 0, 1)];

function cardboard(wm, hm, seed, seams, tone = 0) {

    g.strokeStyle = 'rgba(255,226,182,.30)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x1 * cw + 3, y1 * ch + 3); g.lineTo(x2 * cw + 3, y2 * ch + 3); g.stroke();
    g.strokeStyle = 'rgba(64,36,12,.62)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x1 * cw, y1 * ch); g.lineTo(x2 * cw, y2 * ch); g.stroke();
  }

  const edge = (x0, y0, x1, y1, rx, ry, rw, rh) => { const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, 'rgba(45,24,8,.5)'); gr.addColorStop(1, 'rgba(45,24,8,0)'); g.fillStyle = gr; g.fillRect(rx, ry, rw, rh); };
  edge(0, 0, e, 0, 0, 0, e, ch); edge(cw, 0, cw - e, 0, cw - e, 0, e, ch); edge(0, 0, 0, e, 0, 0, cw, e); edge(0, ch, 0, ch - e, 0, ch - e, cw, e);

}

const roomGroup = new THREE.Group(); scene.add(roomGroup);
function wall(w, h, tex, pos, rot) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: .96, metalness: 0 }));
  m.position.copy(pos); m.rotation.set(rot[0], rot[1], rot[2]); m.receiveShadow = true; roomGroup.add(m); return m;
}
wall(W, H, cardboard(W, H, 11, [[.37, 0, .37, 1], [.63, 0, .63, 1], [.37, .5, 1, .5], [0, .62, .37, .62]]), new V3(0, H / 2, -D / 2), [0, 0, 0]);
const frontWall = wall(W, H, cardboard(W, H, 12, [[.5, 0, .5, 1]], -2), new V3(0, H / 2, D / 2), [0, Math.PI, 0]);
wall(D, H, cardboard(D, H, 13, [[0, .9, 1, .9], [.55, 0, .55, .9]], 2), new V3(-W / 2, H / 2, 0), [0, Math.PI / 2, 0]);
wall(D, H, cardboard(D, H, 14, [[0, .9, 1, .9], [.3, 0, .3, .9]], 2), new V3(W / 2, H / 2, 0), [0, -Math.PI / 2, 0]);
wall(W, D, cardboard(W, D, 15, [[0, .5, 1, .5]], 3), new V3(0, 0, 0), [-Math.PI / 2, 0, 0]);
wall(W, D, cardboard(W, D, 16, [[.5, 0, .5, 1], [0, .5, 1, .5]], -5), new V3(0, H, 0), [Math.PI / 2, 0, 0]);

// Sortie : ouverture noire dans le mur droit
const EXIT = { z0: 0.95, z1: 2.25, h: 2.5 };
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d'), R = mulberry(7);
  const pts = [];
  for (let i = 0; i <= 20; i++) pts.push([30 + R() * 14, 500 - i * 24]);
  for (let i = 0; i <= 10; i++) pts.push([30 + i * 19.6, 22 + R() * 18]);
  for (let i = 0; i <= 20; i++) pts.push([226 - R() * 14, 22 + i * 24]);
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  g.fillStyle = '#060403'; g.fill();
  g.strokeStyle = 'rgba(232,190,130,.55)'; g.lineWidth = 5; g.stroke();
  g.strokeStyle = 'rgba(60,32,10,.8)'; g.lineWidth = 2; g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(EXIT.z1 - EXIT.z0, EXIT.h), new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: .1 }));
  m.position.set(W / 2 - 0.012, EXIT.h / 2, (EXIT.z0 + EXIT.z1) / 2); m.rotation.y = -Math.PI / 2; roomGroup.add(m);
}

// Plafonnier
const lamp = new THREE.Group();
lamp.add(new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, .5, 6), new THREE.MeshBasicMaterial({ color: 0x1a120c })));
lamp.children[0].position.y = H - .25;
const bulb = new THREE.Mesh(new THREE.SphereGeometry(.11, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff1c8 }));
bulb.position.y = H - .56; lamp.add(bulb); scene.add(lamp);
const light = new THREE.PointLight(0xffc98c, 160, 0, 1.5);

light.shadow.mapSize.set(1024, 1024); light.shadow.bias = -0.002; light.shadow.normalBias = 0.02;
light.shadow.camera.near = .1; light.shadow.camera.far = 25;

// ───────────────────────── Boules ─────────────────────────
const RB = 0.55, MB = 40;
function ballTex(n, col) {

}
const BALL_START = [
  { n: 5, c: '#c92424', p: [2.0, RB, 0.2] },
  { n: 3, c: '#d22b2b', p: [3.1, RB, 0.2] },

const balls = BALL_START.map(def => {

    new THREE.MeshPhysicalMaterial({ map: ballTex(def.n, def.c), roughness: .32, clearcoat: 1, clearcoatRoughness: .08 }));

// ───────────────────────── Personnage (illustration 2D dessinée en direct) ─────────────────────────
const CW = 256, CH = 512;
const manCanvas = document.createElement('canvas'); manCanvas.width = CW; manCanvas.height = CH;
const mctx = manCanvas.getContext('2d');
const manTex = new THREE.CanvasTexture(manCanvas); manTex.colorSpace = THREE.SRGBColorSpace;
const charGroup = new THREE.Group(); scene.add(charGroup);
const manMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 2).translate(0, 1, 0),
  new THREE.MeshBasicMaterial({ map: manTex, alphaTest: .5, side: THREE.DoubleSide, color: 0xeadbc8 }));
manMesh.castShadow = true; charGroup.add(manMesh);

const COL = { out: '#22150c', shirt: '#2a4fb3', shirtD: '#1d3884', pants: '#1f2747', pantsD: '#151a33', skin: '#e9b58f', skinD: '#c98f6d', hair: '#6f675f', shoe: '#14100d', bottle: '#2f6b2a', belt: '#2a1b12' };
function drawMan(g, P) {
  g.clearRect(0, 0, CW, CH);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const ph = P.phase, sw = P.walkAmt, L = P.lean;
  const thigh = 118, shin = 112;
  const hip = { x: 128, y: 0 };
  const legAng = s => (s ? 1 : -1) * (Math.sin(ph) * 0.5 * sw + P.spread * 0.45) + P.legsFwd + P.crouch * 0.9;
  const knee = s => Math.max(0, Math.sin(ph + (s ? 0 : Math.PI) + 1.4)) * 0.85 * sw + P.crouch * 1.5 + P.legsFwd * 0.3;

  A = leg(true); B = leg(false);
  const limb = (pts, w, col) => {
    for (const [lw, c] of [[w + 7, COL.out], [w, col]]) {

    }
  };
  const shoe = (f, col) => { g.fillStyle = COL.out; g.beginPath(); g.ellipse(f.x + 10, f.y - 2, 26, 13, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = col; g.beginPath(); g.ellipse(f.x + 10, f.y - 3, 22, 9, 0, 0, Math.PI * 2); g.fill(); };
  const sh = { x: hip.x + 138 * Math.sin(L), y: hip.y - 138 * Math.cos(L) };
  const armPts = s => {
    const sg = s ? 1 : -1;
    const a = -sg * Math.sin(ph) * 0.55 * sw + P.armsUp * -2.4 * (s ? 1 : 0.8) + sg * P.spread * 0.7 + 0.12 + L * 0.5;

const char = { p: new V3(), v: new V3(), up: new V3(0, 1, 0), upTarget: new V3(0, 1, 0), state: 'idle', timer: 0, theta: 0,

// ───────────────────────── Entrée : capteur, calibrage, clavier ─────────────────────────
const raw = new V3(0, -1, 0);         // gravité mesurée, repère écran, filtrée

// ───────────────────────── Vue / caméra hors axe ─────────────────────────
let view;
function setView(name) {

// ───────────────────────── Physique ─────────────────────────
let simT = 0;
function charDims() { const s = S.scale, hh = 0.875 * s, r = 0.35 * s; return { s, hh, r, L: hh - r }; }

function resetRoom() {
  const { hh } = charDims();
  char.p.set(-3.5, hh - 0.001, 0.8); char.v.set(0, 0, 0); char.up.set(0, 1, 0); char.upTarget.set(0, 1, 0);
  char.state = 'idle'; char.timer = 0; char.tumble = 0; char.contacts = []; char.deadT = 0;
  for (const b of balls) { b.out = false; b.mesh.visible = true; b.p.fromArray(b.def.p); b.v.set(0, 0, 0); b.sleep = true; b.sleepRef.set(0, -1, 0); b.still = 0; b.mesh.quaternion.identity(); b.mesh.rotation.set(0.3, 1.1 * b.def.n, 0.2); }

}

function die(cause) {

  char.state = 'dead'; char.deadT = 1.3; char.cause = cause;
}

function stepChar(dt) {

function onCharImpact(imp, n) {

function charWalls() {

      if (side < 0 ? c.p[k] - ext < lim : c.p[k] + ext > lim) {

  }
  for (const b of balls) if (!b.out && b.p.z > D / 2 + 4) { b.out = true; b.sleep = true; b.mesh.visible = false; }
  // sortie
  const c = char;
  if (c.state !== 'dead' && c.state !== 'win' && c.p.z > D / 2 + 0.6) die('tombé dehors');
  if (c.state !== 'dead' && c.state !== 'win') {
    const { r, L } = charDims(), ext = L * Math.abs(c.up.x) + r, exY = L * Math.abs(c.up.y) + r;
    if (c.p.x + ext >= W / 2 - 0.03 && c.p.z > EXIT.z0 && c.p.z < EXIT.z1 && c.p.y - exY < EXIT.h - 0.3) {
      c.state = 'win'; c.deadT = 2.0; showFade('Salle terminée'); thud(3, 220);
    }
  }
  // mort / victoire : fondu puis redémarrage
  if (c.state === 'dead' || c.state === 'win') {
    c.deadT -= dt;
    if (c.state === 'dead' && c.deadT < 0.45 && fadeEl.style.opacity !== '1') showFade('');
    if (c.deadT <= 0) { resetRoom(); hideFade(); }
  }
  simT += dt;
}

// ───────────────────────── Visuels ─────────────────────────
const fadeEl = document.getElementById('fade');
function showFade(text) { fadeEl.textContent = text; fadeEl.style.opacity = '1'; }
function hideFade() { fadeEl.style.opacity = '0'; }
const toastEl = document.getElementById('toast'); let toastT = 0;
function toast(t) { toastEl.textContent = t; toastEl.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(() => toastEl.style.opacity = '0', 1600); }

const pose = { phase: 0, walkAmt: 0, lean: 0, crouch: 0, armsUp: 0, spread: 0, legsFwd: 0, headTilt: 0, eyeLid: .5, mouth: 0 };
const _n = new V3(), _su = new V3(), _sr = new V3();
function updateVisuals(dt, t) {
  const c = char, { s, hh } = charDims(), dr = S.drunk;
  for (const b of balls) b.mesh.position.copy(b.p);
  const n = c.contacts.length ? c.up : c.up;
  const vt = c.v.clone().addScaledVector(n, -c.v.dot(n)), sp = vt.length();
  const tgt = { walkAmt: 0, lean: 0, crouch: 0, armsUp: 0, spread: 0, legsFwd: 0, headTilt: 0.12 * dr * Math.sin(t * 1.1), mouth: 0 };
  switch (c.state) {
    case 'idle': tgt.lean = 0.07 * dr * Math.sin(t * 1.4); break;
    case 'walk': tgt.walkAmt = clamp(sp / (0.45 * s), 0, 1); pose.phase += dt * sp / (0.26 * s); tgt.lean = 0.1 * tgt.walkAmt + 0.08 * dr * Math.sin(t * 2.1); break;
    case 'carried': tgt.walkAmt = 1; pose.phase += dt * sp / (0.22 * s); tgt.lean = 0.32 + 0.06 * Math.sin(t * 9); tgt.armsUp = 0.45 + 0.35 * Math.sin(t * 11); tgt.spread = 0.15; tgt.mouth = 1; break;
    case 'fall': tgt.spread = 0.7; tgt.armsUp = 0.6; tgt.mouth = 1; break;
    case 'land': tgt.crouch = clamp(c.timer / 0.5, 0, 1); break;
    case 'dead': tgt.spread = 0.25; tgt.mouth = 1; break;
  }
  const k = 1 - Math.exp(-dt * 10);
  for (const key in tgt) pose[key] += (tgt[key] - pose[key]) * k;
  pose.eyeLid = c.state === 'dead' ? 1 : 0.45 + 0.25 * Math.sin(t * 0.7);
  drawMan(mctx, pose); manTex.needsUpdate = true;

  // orientation du sprite : face caméra, « haut » = normale de son sol
  const feet = c.p.clone().addScaledVector(c.up, -hh);
  charGroup.position.copy(feet);
  _n.copy(camera.position).sub(feet).normalize();
  _su.copy(c.up).addScaledVector(_n, -c.up.dot(_n));
  if (_su.lengthSq() < 0.04) _su.copy(view.up).addScaledVector(_n, -view.up.dot(_n));
  _su.normalize();
  _sr.crossVectors(_su, _n).normalize();
  _m.makeBasis(_sr, _su, _n); charGroup.quaternion.setFromRotationMatrix(_m);
  const f = c.v.dot(_sr);
  if (c.state !== 'dead' && c.state !== 'fall') { if (f > 0.12 * s) c.facing = 1; else if (f < -0.12 * s) c.facing = -1; }
  manMesh.scale.x = Math.abs(manMesh.scale.x) * c.facing;
  if (c.state === 'fall') c.tumble += dt * 3.2 * (c.tumbleDir || 1);
  else if (c.state === 'dead') c.tumble += ((c.facing > 0 ? 1 : -1) * Math.PI / 2 - c.tumble) * (1 - Math.exp(-dt * 12));
  else c.tumble *= Math.exp(-dt * 10);
  manMesh.rotation.z = c.tumble + 0.05 * dr * Math.sin(t * 1.7) * (c.state === 'idle' || c.state === 'walk' ? 1 : 0);
  manMesh.position.y = c.state === 'dead' ? 0.12 * s : 0;
}

// grain
const grain = document.getElementById('grain'), gctx = grain.getContext('2d'), gimg = gctx.createImageData(200, 120);
function updateGrain() { const d = gimg.data; for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } gctx.putImageData(gimg, 0, 0); }

// débogage
const dbg = document.getElementById('debug'); let dbgT = 0, fps = 60;
function updateDebug(dt) {
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  if ((dbgT += dt) < 0.12 || dbg.hidden) return; dbgT = 0;
  const c = char;
  dbg.textContent = `état      ${c.state}${c.cause && c.state === 'dead' ? ' (' + c.cause + ')' : ''}\n` +
    `θ         ${(c.theta / DEG).toFixed(1)}°\n` +
    `gravité   ${G.x.toFixed(1)} ${G.y.toFixed(1)} ${G.z.toFixed(1)}\n` +
    `vitesse   ${c.v.length().toFixed(2)} m/s\n` +
    `entrée    ${haveSensor ? 'capteur' + (autoInv ? ' (inversé auto)' : '') : 'clavier / souris'}\n` +
    `vue       ${VIEWS_LABEL[view.name]}\n` +
    `i/s       ${fps.toFixed(0)}`;
}

// ───────────────────────── Boucle ─────────────────────────
let running = false, last = performance.now(), acc = 0, frameN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running) {
    updateInput(dt);
    acc += dt; const h = 1 / 120; let n = 0;
    while (acc >= h && n < 12) { step(h); acc -= h; n++; }
    if (n === 12) acc = 0;
  }
  updateCamera(dt);
  updateVisuals(dt, now / 1000);
  renderer.render(scene, camera);
  if ((frameN++ & 1) === 0) updateGrain();
  updateDebug(dt);
}

// ───────────────────────── Démarrage ─────────────────────────
setView(S.view);
buildPanel();
resetRoom();
gScreen.copy(view.dS);
requestAnimationFrame(frame);
window.__proto = { char, balls, G, get S() { return S; }, setTilt(r, p) { vRoll = r; vPitch = p; },
  sim(sec) { const h = 1 / 120; for (let i = 0; i < sec * 120; i++) { updateInput(h); step(h); } updateCamera(1); updateVisuals(1 / 60, simT); renderer.render(scene, camera); } };

document.getElementById('go').addEventListener('click', async () => {
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  try { if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch (e) {}
  try { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  try { if (document.documentElement.requestFullscreen && matchMedia('(pointer: coarse)').matches) { await document.documentElement.requestFullscreen(); await screen.orientation?.lock?.('landscape'); } } catch (e) {}
  try { await navigator.wakeLock?.request('screen'); } catch (e) {}
  document.getElementById('start').hidden = true;
  setTimeout(() => { if (!haveSensor) raw.copy(virtualRaw()); calibrate(); resetRoom(); running = true; }, 350);
});
document.getElementById('bRecal').addEventListener('click', () => { if (!haveSensor) { vRoll = 0; vPitch = 0; raw.copy(virtualRaw()); } calibrate(); });
document.getElementById('bReset').addEventListener('click', () => { resetRoom(); hideFade(); });
document.getElementById('bSet').addEventListener('click', () => { panel.hidden = !panel.hidden; });
</script>
</body>
